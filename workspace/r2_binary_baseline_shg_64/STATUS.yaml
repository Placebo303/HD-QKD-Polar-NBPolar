    blocking: false
    text: "sc_margin is now a short 7-point candidate list {0.02,0.05,0.08,0.12,0.18,0.25,0.30}, not a dense sweep -- revised for tractability, see D_BIN_SC_DECODER_COMPLEXITY below. --dry-run-one will still reveal if the list needs widening. See contract §3/§3.1/§11."
  - id: D_BIN_SC_DECODER_COMPLEXITY
    resolved_by: self-adjudicated (operator), evidence-backed
    blocking: false
    text: >-
      NEW FINDING (this preparation pass, via `_selfcheck_sc_timing.py`):
      the frozen `polar_sc_decode_with_frozen` is O(N^2 log N) per frame
      (80.771 ms/call at N=4096 post-JIT, not the O(N log N) a standard SC
      decoder would give). The packet's original design
      (CALIB_N_FRAMES=4000, dense sc_margin sweep) was infeasible at this
      cost (a real attempt ran >8 CPU-minutes without finishing and was
      killed). RESOLVED in this same pass: CALIB_N_FRAMES lowered to 100
      (the frozen baseline's OWN `--frames` CLI default) and the margin
      sweep replaced by the 7-point list (echoing the baseline's own
      `--scl-margins` short-list style). Re-verified via
      `_smoke_synthetic.py` (PASS, 5.6s) and the timing probe itself. This
      is flagged prominently (not silently fixed) because it changes the
      contract's own numbers from what PI's 2026-09-29 directional
      go-ahead was based on -- the Pre-EXECUTE reviewer should
      specifically re-check this arithmetic (contract §3.1).
  - id: D_BUDGET_NUMBERS
    resolved_by: null
    blocking: false
    text: >-
      Contract §6 proposes 1200s/(block,grid-point) wall, 4 GiB/block RSS,
      4h total wall (serial single process; in-code check). With the REVISED construction-search
      cost (D_BIN_SC_DECODER_COMPLEXITY above), the estimated real cost is
      ~75 min PER SESSION (worst case) x 2 sessions = ~150 min construction
      + ~28 min (64-block x <=4-grid-point SC decode) = ~178 min ~= 3.0h --
      well under 4h, so the stated budget is generously conservative, not
      the bottleneck it originally appeared to be. (Pre-EXECUTE round 1 C2
      fix: an earlier write-up mischaracterized 75 min as already being
      the two-session combined figure; corrected here and in
      TASK_PACKET.md.) --dry-run-one timing is still the concrete
      pre-full-run check; not blocking Pre-EXECUTE review of the packet's
      logic, but IS the input the PI authorization text needs before
      confirming the budget table in AUTHORIZATION_PROMPT.md.
  - id: D_BIN_DECODER_STRENGTH_PARITY
    resolved_by: self-adjudicated (operator, per main-thread requirement (3))
    blocking: false
    text: >-
      Table A (NB-SC vs binary-SC) is the only same-strength comparison;
      Table B1 (NB-SCL(L=16) vs binary-SC) and Table B2 (NB-SCL(L=16) vs
      binary-CA-SCL's `all_applicable_msg_exact` proxy) are explicitly
      labeled different-decoder-strength / descriptive-only in the
      contract §4.1 and in `build_cross_comparison`'s own
      `decoder_strength_parity_note` field. Recommend: accept -- building a
      binary-side list decoder that does not sacrifice real data bits (to
      make a true L-for-L comparison possible) is out of this packet's
      scope.
